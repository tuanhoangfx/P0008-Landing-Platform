<section class="hero" id="top" data-rail="{{c.rail.top}}" data-rail-icon="home">
  <div class="hero__aura" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="hero__grid" aria-hidden="true"></div>
  <div class="wrap hero__copy">
    <a class="pill" href="{{l}}/download/" data-hero-item>
      <span class="pill__dot"></span><span data-release-tag>{{c.hero.pill}} {{releaseTag}}</span><b aria-hidden="true">→</b>
    </a>
    <h1 class="hero__title" data-split>{{c.hero.title}} <em>{{c.hero.titleEm}}</em>.</h1>
    <p class="hero__lead" data-hero-item>{{c.hero.lead}}</p>
    <div class="hero__cta" data-hero-item>
      <a class="btn btn--primary btn--lg" href="{{l}}/download/" data-magnetic data-download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5 10.5 4.5v7H3zM11.5 4.4 21 3v8.5h-9.5zM3 12.5h7.5v7L3 18.5zM11.5 12.5H21V21l-9.5-1.4z" fill="currentColor"/></svg>
        <span>{{c.hero.primary}}</span>
        <small data-release-meta>{{releaseSize}}</small>
      </a>
      <a class="btn btn--ghost btn--lg" href="{{l}}/guide/">{{c.hero.secondary}} <span class="muted">· {{stepCount}} {{c.hero.stepsSuffix}}</span></a>
    </div>
  </div>
  <div class="wrap hero__stage" data-hero-stage>
    <!--@hero-shot-->
    <div class="hero__glow" aria-hidden="true"></div>
  </div>
  <!--@stats-->
</section>
