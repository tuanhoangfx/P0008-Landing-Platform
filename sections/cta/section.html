<section class="section cta" id="download" data-rail="{{c.rail.download}}" data-rail-icon="download">
  <div class="wrap">
    <div class="cta__card" data-reveal data-spot>
      <div class="cta__aura" aria-hidden="true"></div>
      <img src="/favicon.svg" width="64" height="64" alt="" class="cta__logo">
      <h2>{{c.cta.title}}</h2>
      <p>{{c.cta.body}}</p>
      <div class="hero__cta">
        <a class="btn btn--primary btn--lg" href="{{l}}/download/" data-magnetic data-download><span>{{c.cta.primary}}</span><small data-release-meta>{{releaseMeta}}</small></a>
        <a class="btn btn--ghost btn--lg" href="{{l}}/guide/install/">{{c.cta.secondary}}</a>
      </div>
    </div>
  </div>
</section>
